version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: library-mysql

    environment:
      MYSQL_ROOT_PASSWORD: adarsh8106
      MYSQL_DATABASE: librarydb1

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    container_name: library-app

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/librarydb1
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: adarsh8106

volumes:
  mysql-data: